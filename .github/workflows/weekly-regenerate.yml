name: Weekly Data Regeneration

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: Regenerate dataset from PokeAPI
        run: npm run generate

      - name: Verify dataset
        run: npm run verify

      - name: Open a PR if the dataset changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Weekly PokeAPI data regeneration'
          title: 'Weekly PokeAPI data regeneration'
          body: |
            Automated weekly regeneration via `.github/workflows/weekly-regenerate.yml`.

            `npm run verify` passed before this PR was opened (a fresh, full fetch —
            not incremental, see TODO.md #7). Review the diff in
            `data/v1/living-form-full-data.json` and
            `data/v1/living-form-full-mapping-report.json` for anything unexpected
            (new/removed entries, orphan candidates) before merging.
          branch: auto/weekly-data-regeneration
          delete-branch: true
